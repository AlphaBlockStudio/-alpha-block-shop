<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ألفا بلوك - فحص الأكواد والمتجر</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; color: #333; }
        .container { max-width: 700px; margin: 30px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { color: #0056b3; }
        textarea { width: 90%; height: 200px; padding: 15px; border-radius: 8px; border: 1px solid #ccc; font-family: monospace; font-size: 14px; text-align: left; direction: ltr; margin-top: 15px; resize: none; }
        .btn { display: inline-block; background-color: #28a745; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 6px; cursor: pointer; margin-top: 15px; font-weight: bold; width: 95%; }
        .btn:hover { background-color: #218838; }
        .result-box { margin-top: 20px; padding: 15px; background: #e9ecef; border-radius: 8px; text-align: left; direction: ltr; font-family: monospace; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في ألفا بلوك (Alpha Block)</h1>
        <p>قم بلصق الكود الخاص بك في الصندوق بالأسفل لفحصه وتصحيحه تلقائياً:</p>
        
        <!-- صندوق وضع الكود -->
        <textarea id="userCode" placeholder="// الصق كود البرمجة الخاص بك هنا..."></textarea>
        
        <button class="btn" onclick="checkCode()">افحص وصحح الكود بالذكاء الاصطناعي</button>
        
        <!-- صندوق النتيجة -->
        <div id="result" class="result-box"></div>
    </div>

    <script>
        function checkCode() {
            var code = document.getElementById("userCode").value;
            if(code.trim() === "") {
                alert("من فضلك ضع كوداً أولاً ليتمكن الذكاء الاصطناعي من فحصه!");
                return;
            }
            var resultDiv = document.getElementById("result");
            resultDiv.style.display = "block";
            resultDiv.innerHTML = "<strong>جاري الاتصال بالذكاء الاصطناعي...</strong><br>تم استقبال كودك بنجاح وجاري فحصه.";
        }
    </script>
</body>
</html>
