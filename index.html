<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر شركة ألفا بلوك</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; padding: 20px; }
        h1 { color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        button { background-color: #28a745; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h1>مرحباً بك في ألفا بلوك (Alpha Block)</h1>
        <p>موقع لخدمات البرمجة، تحويل الأكواد إلى تطبيقات، والبحث عن وظائف.</p>
        <button onclick="alert('قريباً سيتم تفعيل ميزة تصحيح الأكواد!')">ابدأ تصحيح الكود الخاص بك</button>
    </div>
</body>
</html>
